<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="PIDUM SBS">
    <meta name="application-name" content="PIDUM SBS">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#e8eaf0">
    <title>PIDUM SBS</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icons/icon-180.png">
    <link rel="icon" sizes="192x192" href="./icons/icon-192.png">
    <style>
        html, body {
            margin: 0; padding: 0;
            height: 100%; height: 100dvh;
            width: 100%;
            overflow: hidden;
            background: #e8eaf0;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
        }
        iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <iframe src="https://script.google.com/macros/s/AKfycbxyKYwmFgfyZLxmTzJSO0NbKZ68VQQiBOXAwOiVyEY3VMz3ZWWpHj2weVPVni18ZiRHhg/exec" allow="clipboard-write"></iframe>
    <script>
        // iOS mengabaikan user-scalable=no; cubit zoom hanya bisa dicegah
        // lewat event gesture. Wrapper memegang layar di mode standalone,
        // jadi pengunci dipasang di sini juga.
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
            document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
        });
    </script>
</body>
</html>
